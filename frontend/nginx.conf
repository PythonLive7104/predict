# When a TLS-terminating proxy sits in front (Caddy, in the tls overlay), it has
# already set X-Forwarded-Proto: https. Blindly writing $scheme here overwrites
# that with "http" — this hop is plaintext — and Django then believes an HTTPS
# request was insecure, issues its own redirect to HTTPS, and the request loops
# until the browser gives up.
#
# So pass through whatever arrived, falling back to $scheme only when nothing
# did (the http overlay, where nginx really is the edge).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API and the Telegram/IPN webhooks live on the backend. Proxying them
    # through the same origin keeps the SPA, the Mini App and the webhooks on one
    # hostname — which is also what Telegram requires for the Mini App.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /hooks/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /static/ { proxy_pass http://web:8000; }

    # Client-side routing: unknown paths are React routes, not 404s.
    location / { try_files $uri $uri/ /index.html; }
}
