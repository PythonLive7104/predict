server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API and the Telegram/IPN webhooks live on the backend. Proxying them
    # through the same origin keeps the SPA, the Mini App and the webhooks on one
    # hostname — which is also what Telegram requires for the Mini App.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /hooks/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { proxy_pass http://web:8000; }

    # Client-side routing: unknown paths are React routes, not 404s.
    location / { try_files $uri $uri/ /index.html; }
}
